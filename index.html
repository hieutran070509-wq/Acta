<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Acta — a record of things done</title>
<link rel="stylesheet" href="acta.css">
</head>
<body>

  <div id="topbar">
    <div id="brandWrap">
      <div id="brand">
        <div class="title">ACTA</div>
        <div class="tagline" id="taglineText">things done — not things planned</div>
      </div>
      <div id="levelBlock" tabindex="0">
        <div class="lv"><span id="lvPrefix">LEVEL</span> <b id="levelValue">0</b></div>
        <div id="levelBarTrack"><div id="levelBarFill"></div></div>
        <div id="apLabel"><b id="totalAp">0</b> <span id="apSuffix">AP</span></div>
        <div id="levelTooltip"></div>
      </div>
    </div>

    <div id="toolbar">
      <button class="icon-btn" id="undoBtn" title="Undo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
      </button>
      <button class="icon-btn" id="redoBtn" title="Redo" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
      </button>

      <div class="toolbar-sep"></div>

      <button class="text-btn" id="statsBtn" title="Statistics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
        <span class="btn-label" id="statsBtnLabel">Statistics</span>
      </button>

      <button class="text-btn big" id="todoBtn" title="To-Do" style="position:relative;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
        <span class="btn-label" id="todoBtnLabel">To-Do</span>
        <span class="badge" id="todoBadge" style="display:none;">0</span>
      </button>

      <div class="toolbar-sep"></div>

      <button class="icon-btn" id="importBtn" title="Import">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      </button>
      <button class="icon-btn" id="exportBtn" title="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
      </button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">

      <div class="toolbar-sep"></div>

      <div style="position:relative;">
        <button class="icon-btn" id="soundBtn" title="Sound &amp; vibration">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
        </button>
        <div id="soundPop">
          <div class="row"><span id="soundLabelText">Sound</span><div class="mini-switch on" id="soundSwitch"><div class="dot"></div></div></div>
          <div class="row"><span id="vibLabelText">Vibration</span><div class="mini-switch on" id="vibSwitch"><div class="dot"></div></div></div>
          <div class="row" style="flex-direction:column; align-items:stretch; gap:4px;">
            <span id="volLabelText">Volume</span>
            <input type="range" id="volSlider" min="0" max="100" value="50">
          </div>
        </div>
      </div>

      <button class="theme-switch" id="themeToggle" title="Toggle theme">
        <div class="knob">
          <span class="icon-sun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg></span>
          <span class="icon-moon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg></span>
        </div>
      </button>

      <button class="icon-btn" id="avatarBtn" title="Account">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </button>
    </div>
  </div>

  <div id="feedOuter"><div id="feedPanel"><div id="feed"></div></div></div>

  <div id="dock">
    <div id="streakStrip">
      <span class="flames" id="flameIcons"><span class="flame" data-i="0">🔥</span></span>
      <span class="num" id="streakNum">0</span>
      <span class="label" id="streakLabelText">day streak</span>
      <span class="sep">·</span>
      <span class="num" id="todayCountNum">0</span>
      <span class="label" id="todayCountLabelText">today</span>
    </div>

    <div id="pillWrap">
      <div id="suggest"></div>
      <div id="dockPrompt">
        <span class="glyph">&gt;</span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </div>
    </div>
    <div id="dockHint">No pressure, just progress. What did you complete today?</div>
  </div>

  <div id="overlay">
    <div id="modal">
      <div id="modalHead">
        <h2 id="statsTitleText">STATISTICS</h2>
        <button id="modalCloseX" aria-label="Close">✕</button>
      </div>
      <div id="tabs">
        <button class="tab-btn active" data-tab="overview" id="tabOverviewBtn">Overview</button>
        <button class="tab-btn" data-tab="history" id="tabHistoryBtn">History</button>
        <button class="tab-btn" data-tab="daily" id="tabDailyBtn">Daily</button>
      </div>
      <div id="tabBody">
        <div class="tab-pane active" id="pane-overview"></div>
        <div class="tab-pane" id="pane-history"></div>
        <div class="tab-pane" id="pane-daily"></div>
      </div>
    </div>
  </div>

  <div id="drawerScrim"></div>

  <div class="drawer" id="todoDrawer">
    <div class="drawer-head"><h2 id="todoDrawerTitle">To-Do</h2><button class="drawer-close" data-close="todoDrawer">✕</button></div>
    <div class="drawer-body">
      <div id="todoAddRow">
        <input type="text" id="todoAddInput" placeholder="Add a task… #tag">
        <button id="todoAddBtn">+</button>
      </div>
      <div id="todoList"></div>
    </div>
  </div>

  <div class="drawer" id="userDrawer">
    <div class="drawer-head"><h2 id="accountTitleText">Account</h2><button class="drawer-close" data-close="userDrawer">✕</button></div>
    <div class="drawer-body">
      <div class="acc-tabs">
        <button class="acc-tab-btn active" data-acctab="sync" id="accTabSyncBtn">Sync</button>
        <button class="acc-tab-btn" data-acctab="achievements" id="accTabAchBtn">Achievements</button>
        <button class="acc-tab-btn" data-acctab="language" id="accTabLangBtn">Language</button>
      </div>
      <div class="acc-pane active" id="acc-sync"></div>
      <div class="acc-pane" id="acc-achievements"></div>
      <div class="acc-pane" id="acc-language"></div>
    </div>
  </div>

  <div id="confirmOverlay">
    <div id="confirmCard">
      <div id="confirmMessage"></div>
      <div id="confirmActions">
        <button id="confirmCancelBtn"></button>
        <button id="confirmOkBtn"></button>
      </div>
    </div>
  </div>

  <div id="milestoneOverlay">
    <div id="milestoneCard">
      <div id="milestoneLevel"><span id="milestoneLevelPrefix">LEVEL</span><b id="milestoneLevelNum">0</b></div>
      <div id="milestoneSlogan"></div>
      <button id="milestoneClose">Nice!</button>
    </div>
  </div>

  <div id="toastHost"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="acta.js"></script>`n</body>
</html>
